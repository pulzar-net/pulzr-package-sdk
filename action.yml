name: Pulzr extension module
description: Build, validate and test a Pulzr extension module (a gateway support package or a carrier driver) and, on a version tag, release exactly the files the platform installs from.
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: The package's directory.
    default: .
  release:
    description: "'true' to publish a GitHub release for the tag (the tag must be v<the manifest's version>)."
    default: 'false'
  manifest:
    description: The manifest, if not gateway.json or driver.json.
    default: ''
runs:
  using: composite
  steps:
    - name: Rust for wasm32
      shell: bash
      run: rustup target add wasm32-unknown-unknown
    - name: pulzr-pkg
      shell: bash
      run: python3 -m pip install --quiet "${{ github.action_path }}/python"
    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pulzr-pkg ${{ inputs.manifest && format('--manifest {0}', inputs.manifest) }} build
    - name: Validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pulzr-pkg ${{ inputs.manifest && format('--manifest {0}', inputs.manifest) }} validate
    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pulzr-pkg ${{ inputs.manifest && format('--manifest {0}', inputs.manifest) }} test -v
    - name: The tag is the manifest's version
      if: inputs.release == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        manifest="$(pulzr-pkg ${{ inputs.manifest && format('--manifest {0}', inputs.manifest) }} assets | head -n1)"
        version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")"
        [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "the tag ${GITHUB_REF_NAME} is not v${version}" >&2; exit 1; }
    - name: Release
      if: inputs.release == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mapfile -t assets < <(pulzr-pkg ${{ inputs.manifest && format('--manifest {0}', inputs.manifest) }} assets)
        # The notes are the annotated tag's message (git tag -a vX.Y.Z
        # --cleanup=whitespace -F notes.md), else GitHub's generated notes;
        # never none.
        TAG="${GITHUB_REF_NAME}"
        notes="${RUNNER_TEMP}/notes.md"
        git fetch -q --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
        : > "${notes}"
        if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
          git cat-file tag "refs/tags/${TAG}" | sed '1,/^$/d; /^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "${notes}"
        fi
        if ! awk -v t="${TAG}" 'NF && $0 != t { f = 1 } END { exit !f }' "${notes}"; then
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -q .body > "${notes}"
          awk 'NF && !/Full Changelog/ { f = 1 } END { exit !f }' "${notes}" || {
            echo "::error::${TAG} has no release notes: tag it with git tag -a and the notes as its message"; exit 1; }
        fi
        # The manifest as this build wrote it: its sha256 is this module's,
        # whatever a build elsewhere recorded (builds embed their paths).
        gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${notes}" "${assets[@]}"
