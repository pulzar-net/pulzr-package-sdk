# Tests on every push; a tag vX.Y.Z (the manifest's version) makes a release
# with exactly the files the platform installs from.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pulzar-net/pulzr-package-sdk@v0.1.0
        with:
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
