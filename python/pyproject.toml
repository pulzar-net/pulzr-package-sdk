[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulzr-package"
version = "0.1.1"
description = "Pulzr extension modules: the host that runs them in wasmtime's sandbox (pulzr_host) and the pulzr-pkg CLI that builds, validates and tests them"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["wasmtime>=50,<51", "requests>=2.31", "jsonschema>=4.20"]

[project.scripts]
pulzr-pkg = "pulzr_pkg.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pulzr_host*", "pulzr_pkg*"]

[tool.setuptools.package-data]
pulzr_pkg = ["schema/*", "templates/**/*"]
