[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulzr-pkg"
version = "0.2.0"
description = "Pulzr extension modules: the host that runs them in wasmtime's sandbox (pulzr_host) and the pulzr-pkg CLI that builds, validates and tests them"
license = {text = "MIT"}
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["wasmtime>=50,<51", "requests>=2.31", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://oss.pulzr.net/pulzr-package-sdk/"
Source = "https://github.com/pulzar-net/pulzr-package-sdk"

[project.scripts]
pulzr-pkg = "pulzr_pkg.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pulzr_host*", "pulzr_pkg*"]

[tool.setuptools.package-data]
pulzr_pkg = ["schema/*", "templates/**/*"]
