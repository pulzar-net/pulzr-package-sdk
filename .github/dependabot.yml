version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    groups:
      cargo: {patterns: ['*']}
  - package-ecosystem: pip
    directory: /python
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  # The docs site: the Pulzr docs theme, Astro and Starlight, in one pull request.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
