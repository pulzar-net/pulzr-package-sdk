# On a tag: pulzr-pkg (the CLI and pulzr_host) to PyPI, the pulzr-package
# crate to crates.io, then the GitHub release, with the annotated tag's
# message as its notes. The Action is used by tag and needs nothing published.
#
# pulzr-pkg's version is the SDK's: python/pyproject.toml must equal the tag.
# It is published by PyPI's trusted publishing, with no token: PyPI trusts
# this workflow, in the pypi environment, as the project's publisher.
#
# The crate's version is guest/Cargo.toml's, bumped when the crate changes; a
# tag whose version crates.io already has publishes nothing, so a tag for the
# host or the Action alone is fine. Authenticated with the
# CARGO_REGISTRY_TOKEN secret, or by trusted publishing (OIDC) once the crate
# is set up for it on crates.io and the TRUSTED_PUBLISHING variable is "true";
# with neither, nothing is published.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  pypi:
    # After the crate: the templates pulzr-pkg new writes depend on it.
    needs: crate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: The tag is pulzr-pkg's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -n1)"
          [ "${TAG#v}" = "${want}" ] || { echo "tag ${TAG} is not v${want} (python/pyproject.toml)" >&2; exit 1; }
      - name: Build
        run: python -m pip install --quiet build && python -m build python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Trusted publishing token
        id: oidc
        if: vars.TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.oidc.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "${CARGO_REGISTRY_TOKEN}" ] || { echo "no crates.io token; the crate is not published"; exit 0; }
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' guest/Cargo.toml | head -n1)"
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'pulzr-package-sdk release (github.com/pulzar-net/pulzr-package-sdk)' \
            "https://crates.io/api/v1/crates/pulzr-package/${version}")"
          if [ "${code}" = 200 ]; then echo "pulzr-package ${version} is already on crates.io"; exit 0; fi
          cargo publish -p pulzr-package --locked

  github:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The annotated tag's message (git tag -a vX.Y.Z --cleanup=whitespace
          # -F notes.md), else GitHub's generated notes; never none.
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          git fetch -q --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          : > "${notes}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            git cat-file tag "refs/tags/${TAG}" | sed '1,/^$/d; /^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "${notes}"
          fi
          if ! awk -v t="${TAG}" 'NF && $0 != t { f = 1 } END { exit !f }' "${notes}"; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -q .body > "${notes}"
            awk 'NF && !/Full Changelog/ { f = 1 } END { exit !f }' "${notes}" || {
              echo "::error::${TAG} has no release notes: tag it with git tag -a and the notes as its message"; exit 1; }
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then echo "${TAG} is already released"; exit 0; fi
          gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
