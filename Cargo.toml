[workspace]
resolver = "2"
members = ["guest", "codec", "examples/beacon-gateway", "examples/sensor-codec"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pulzar-net/pulzr-package-sdk"
rust-version = "1.80"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
