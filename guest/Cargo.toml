[package]
name = "pulzr-package"
version = "0.1.0"
description = "Write Pulzr extension modules (gateway support packages, carrier drivers) in Rust: the ABI, typed events and answers, host calls and helpers"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://pulzar-net.github.io/pulzr-package-sdk/"
documentation = "https://docs.rs/pulzr-package"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["pulzr", "iot", "gateway", "wasm", "plugin"]
categories = ["wasm", "api-bindings"]

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
